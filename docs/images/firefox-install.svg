<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Instalar Brave-like Blocker Local en Firefox</title>
  <desc id="desc">Guía visual bilingüe de cuatro pasos para descargar, abrir about debugging, cargar complemento temporal y seleccionar el manifest de Firefox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f3"/>
      <stop offset="1" stop-color="#f4efff"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7139"/>
      <stop offset="0.55" stop-color="#ff9400"/>
      <stop offset="1" stop-color="#9059ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#351b58" flood-opacity="0.15"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #26143d; }
      .step { font-size: 25px; font-weight: 750; letter-spacing: 0.7px; }
      .main { font-size: 26px; font-weight: 650; }
      .sub { font-size: 20px; fill: #665578; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 19px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="78" cy="88" r="43" fill="url(#fire)"/>
  <path d="M55 99 c7 23 39 31 53 6 10-19-7-39-25-36 8 5 10 13 7 20-5-11-17-16-27-10 8 3 12 10 11 17-7-6-14-4-19 3z" fill="#fff" opacity="0.95"/>
  <text x="140" y="75" font-size="42" font-weight="800">Firefox · Brave-like Blocker Local</text>
  <text x="141" y="116" font-size="24" fill="#665578">Instalación temporal en 4 pasos · Temporary installation in 4 steps</text>

  <path d="M235 480 H1365" stroke="#d4b9e9" stroke-width="8" stroke-linecap="round"/>
  <path d="M520 480 l-18 -13 v26z M890 480 l-18 -13 v26z M1260 480 l-18 -13 v26z" fill="#9b6dc3"/>

  <g filter="url(#shadow)">
    <rect x="55" y="180" width="340" height="570" rx="30" fill="#fff"/>
    <circle cx="105" cy="230" r="29" fill="#ff7139"/>
    <text x="105" y="239" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">1</text>
    <text x="150" y="238" class="step">DESCARGA</text>
    <text x="150" y="272" class="sub">DOWNLOAD</text>
    <rect x="92" y="330" width="266" height="170" rx="20" fill="#fff2ec" stroke="#f5ad90" stroke-width="3"/>
    <path d="M225 356 v68 m-27-26 27 28 27-28 M177 448 h96" fill="none" stroke="#ff7139" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="225" y="548" text-anchor="middle" class="main">ZIP de Firefox</text>
    <text x="225" y="582" text-anchor="middle" class="sub">Firefox ZIP</text>
    <text x="225" y="642" text-anchor="middle" class="main">Extrae / Extract</text>
    <text x="225" y="684" text-anchor="middle" class="code">firefox/</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="180" width="340" height="570" rx="30" fill="#fff"/>
    <circle cx="475" cy="230" r="29" fill="#ff9400"/>
    <text x="475" y="239" text-anchor="middle" font-size="27" font-weight="800" fill="#4b2700">2</text>
    <text x="520" y="238" class="step">ABRE</text>
    <text x="520" y="272" class="sub">OPEN</text>
    <rect x="462" y="330" width="266" height="170" rx="20" fill="#fff8e8" stroke="#efc56d" stroke-width="3"/>
    <rect x="482" y="354" width="226" height="40" rx="12" fill="#fff" stroke="#cbbd9c" stroke-width="2"/>
    <circle cx="505" cy="374" r="7" fill="#ff9400"/>
    <text x="595" y="382" text-anchor="middle" font-size="18" fill="#4f3e23">about:debugging</text>
    <rect x="486" y="417" width="218" height="55" rx="10" fill="#f7e8cd"/>
    <text x="595" y="452" text-anchor="middle" font-size="19" font-weight="650">Este Firefox · This Firefox</text>
    <text x="595" y="552" text-anchor="middle" class="main">Pega dirección</text>
    <text x="595" y="586" text-anchor="middle" class="sub">Paste address</text>
    <rect x="462" y="631" width="266" height="48" rx="12" fill="#26143d"/>
    <text x="595" y="662" text-anchor="middle" class="code" fill="#fff">about:debugging</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="795" y="180" width="340" height="570" rx="30" fill="#fff"/>
    <circle cx="845" cy="230" r="29" fill="#9059ff"/>
    <text x="845" y="239" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">3</text>
    <text x="890" y="238" class="step">CARGA</text>
    <text x="890" y="272" class="sub">LOAD</text>
    <rect x="832" y="330" width="266" height="170" rx="20" fill="#f5efff" stroke="#b99aea" stroke-width="3"/>
    <rect x="858" y="378" width="214" height="72" rx="12" fill="#9059ff"/>
    <text x="965" y="407" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Cargar complemento</text>
    <text x="965" y="433" text-anchor="middle" font-size="17" fill="#fff">Load Temporary Add-on</text>
    <text x="965" y="552" text-anchor="middle" class="main">Complemento temporal</text>
    <text x="965" y="586" text-anchor="middle" class="sub">Temporary add-on</text>
    <circle cx="965" cy="655" r="34" fill="#efe7ff"/>
    <path d="M965 635 v40 M945 655 h40" stroke="#9059ff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1165" y="180" width="380" height="570" rx="30" fill="#fff"/>
    <circle cx="1215" cy="230" r="29" fill="#7542e5"/>
    <text x="1215" y="239" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">4</text>
    <text x="1260" y="238" class="step">SELECCIONA</text>
    <text x="1260" y="272" class="sub">SELECT FILE</text>
    <rect x="1202" y="330" width="306" height="170" rx="20" fill="#f4efff" stroke="#b99aea" stroke-width="3"/>
    <path d="M1255 393 h74 l18 19 h108 v63 h-200z" fill="#ffbd4a" stroke="#a96b00" stroke-width="4" stroke-linejoin="round"/>
    <text x="1355" y="548" text-anchor="middle" class="main">Archivo de manifiesto</text>
    <text x="1355" y="582" text-anchor="middle" class="sub">Manifest file</text>
    <rect x="1202" y="625" width="306" height="54" rx="12" fill="#26143d"/>
    <text x="1355" y="659" text-anchor="middle" class="code" fill="#fff">firefox/manifest.json</text>
    <text x="1355" y="710" text-anchor="middle" font-size="18" fill="#665578">Listo · Done</text>
  </g>

  <rect x="145" y="785" width="1310" height="82" rx="22" fill="#26143d"/>
  <text x="800" y="819" text-anchor="middle" font-size="21" font-weight="650" fill="#fff">Firefox normal elimina complementos temporales al reiniciar; instalación permanente requiere firma de Mozilla</text>
  <text x="800" y="849" text-anchor="middle" font-size="18" fill="#e7d9ff">Standard Firefox removes temporary add-ons after restart; permanent installation requires Mozilla signing</text>
</svg>
