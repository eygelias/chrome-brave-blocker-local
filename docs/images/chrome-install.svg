<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Instalar Brave-like Blocker Local en Chrome</title>
  <desc id="desc">Guía visual bilingüe de cuatro pasos para descargar, abrir extensiones, activar modo desarrollador y cargar la carpeta extension.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17305c" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #14213d; }
      .step { font-size: 25px; font-weight: 750; letter-spacing: 0.7px; }
      .main { font-size: 27px; font-weight: 650; }
      .sub { font-size: 21px; fill: #516078; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 21px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="78" cy="80" r="31" fill="#4285f4"/>
  <circle cx="61" cy="96" r="31" fill="#34a853" opacity="0.92"/>
  <circle cx="95" cy="96" r="31" fill="#fbbc05" opacity="0.92"/>
  <circle cx="78" cy="80" r="13" fill="#fff"/>
  <text x="135" y="75" font-size="42" font-weight="800">Chrome · Brave-like Blocker Local</text>
  <text x="136" y="116" font-size="24" fill="#516078">Instalación visual en 4 pasos · Visual installation in 4 steps</text>

  <path d="M235 480 H1365" stroke="#b8c8e8" stroke-width="8" stroke-linecap="round"/>
  <path d="M520 480 l-18 -13 v26z M890 480 l-18 -13 v26z M1260 480 l-18 -13 v26z" fill="#7e9bd0"/>

  <g filter="url(#shadow)">
    <rect x="55" y="180" width="340" height="570" rx="30" fill="#fff"/>
    <circle cx="105" cy="230" r="29" fill="#4285f4"/>
    <text x="105" y="239" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">1</text>
    <text x="150" y="238" class="step">DESCARGA</text>
    <text x="150" y="272" class="sub">DOWNLOAD</text>
    <rect x="92" y="330" width="266" height="170" rx="20" fill="#eef4ff" stroke="#9ab8ef" stroke-width="3"/>
    <path d="M225 356 v68 m-27-26 27 28 27-28 M177 448 h96" fill="none" stroke="#4285f4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="225" y="548" text-anchor="middle" class="main">ZIP de Chrome</text>
    <text x="225" y="582" text-anchor="middle" class="sub">Chrome ZIP</text>
    <text x="225" y="642" text-anchor="middle" class="main">Extrae / Extract</text>
    <text x="225" y="684" text-anchor="middle" class="code">extension/</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="180" width="340" height="570" rx="30" fill="#fff"/>
    <circle cx="475" cy="230" r="29" fill="#34a853"/>
    <text x="475" y="239" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">2</text>
    <text x="520" y="238" class="step">ABRE</text>
    <text x="520" y="272" class="sub">OPEN</text>
    <rect x="462" y="330" width="266" height="170" rx="20" fill="#f4fbf6" stroke="#94d2a5" stroke-width="3"/>
    <rect x="482" y="354" width="226" height="40" rx="12" fill="#fff" stroke="#b9c8bd" stroke-width="2"/>
    <circle cx="505" cy="374" r="7" fill="#34a853"/>
    <text x="595" y="382" text-anchor="middle" font-size="18" fill="#354b3b">chrome://extensions</text>
    <rect x="483" y="416" width="102" height="57" rx="10" fill="#dcefe1"/>
    <rect x="600" y="416" width="108" height="57" rx="10" fill="#dcefe1"/>
    <text x="595" y="552" text-anchor="middle" class="main">Pega dirección</text>
    <text x="595" y="586" text-anchor="middle" class="sub">Paste address</text>
    <rect x="466" y="631" width="258" height="48" rx="12" fill="#14213d"/>
    <text x="595" y="662" text-anchor="middle" class="code" fill="#fff">chrome://extensions/</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="795" y="180" width="340" height="570" rx="30" fill="#fff"/>
    <circle cx="845" cy="230" r="29" fill="#fbbc05"/>
    <text x="845" y="239" text-anchor="middle" font-size="27" font-weight="800" fill="#563f00">3</text>
    <text x="890" y="238" class="step">ACTIVA</text>
    <text x="890" y="272" class="sub">ENABLE</text>
    <rect x="832" y="330" width="266" height="170" rx="20" fill="#fff9e7" stroke="#ecd06e" stroke-width="3"/>
    <text x="965" y="379" text-anchor="middle" font-size="22" font-weight="650">Modo desarrollador</text>
    <text x="965" y="410" text-anchor="middle" font-size="18" fill="#6c5b22">Developer mode</text>
    <rect x="918" y="438" width="94" height="42" rx="21" fill="#4285f4"/>
    <circle cx="990" cy="459" r="16" fill="#fff"/>
    <text x="965" y="552" text-anchor="middle" class="main">Interruptor azul</text>
    <text x="965" y="586" text-anchor="middle" class="sub">Blue toggle = ON</text>
    <circle cx="965" cy="655" r="34" fill="#e8f0fe"/>
    <path d="M948 655 l12 12 24-27" fill="none" stroke="#4285f4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1165" y="180" width="380" height="570" rx="30" fill="#fff"/>
    <circle cx="1215" cy="230" r="29" fill="#ea4335"/>
    <text x="1215" y="239" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">4</text>
    <text x="1260" y="238" class="step">CARGA</text>
    <text x="1260" y="272" class="sub">LOAD UNPACKED</text>
    <rect x="1202" y="330" width="306" height="170" rx="20" fill="#fff1ef" stroke="#ef9c94" stroke-width="3"/>
    <path d="M1255 393 h74 l18 19 h108 v63 h-200z" fill="#ffd76a" stroke="#bf8b00" stroke-width="4" stroke-linejoin="round"/>
    <text x="1355" y="548" text-anchor="middle" class="main">Cargar descomprimida</text>
    <text x="1355" y="582" text-anchor="middle" class="sub">Load unpacked</text>
    <text x="1355" y="634" text-anchor="middle" class="sub">Selecciona / Select:</text>
    <rect x="1222" y="651" width="266" height="50" rx="12" fill="#14213d"/>
    <text x="1355" y="684" text-anchor="middle" class="code" fill="#fff">extension/</text>
  </g>

  <rect x="205" y="792" width="1190" height="70" rx="20" fill="#14213d"/>
  <text x="800" y="824" text-anchor="middle" font-size="22" font-weight="650" fill="#fff">Después de actualizar: pulsa Recargar ↻ y vuelve a abrir las pestañas</text>
  <text x="800" y="852" text-anchor="middle" font-size="19" fill="#d8e4ff">After updating: press Reload ↻ and reopen affected tabs</text>
</svg>
